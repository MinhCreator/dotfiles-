source = ~/.config/hypr/colors.conf
animation = inputField, 0

$font_family = Open Runde
$background_color = 0D0D0DFF
$text_color = rgba(255, 255, 255 ,0.75)
$entry_background_color = rgba(255, 255, 255, 0)
$entry_border_color =  rgba(255, 255, 255, 0)
$entry_color = rgba(255, 255, 255 ,0.72)
$check_color = rgba(156, 156, 156, 0.5)

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = $HOME/.cache/bnsplit/wallpaper-webp
    color = $background_color
    blur_size = 6
    blur_passes = 3
    brightness = 0.60
    noise = 0.0117
    vibrancy_darkness = 0.0
    contrast = 1.3000
    vibrancy = 0.2100
    reload_time = 5
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 1
    dots_size = 0.3
    dots_spacing = 0.25
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    placeholder_text =
    fade_on_empty = false
    check_color = $check_color
    position = 0, 20
    halign = center
    valign = bottom
    rounding = 25
    dots_rounding = -1
}

label { # Attempts
    text = cmd[update:1000] if (( $ATTEMPTS > 0 )); then if (( $ATTEMPTS == 1 )); then echo "Tried $ATTEMPTS time"; else echo "Tried $ATTEMPTS times"; fi; fi
    monitor =
    font_color = $entry_color
    font_size = 12
    font_family = $font_family Medium
    color = $text_color
    position = 0, -20
    halign = center
    valign = top
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color
    font_size = 90
    font_family = $font_family Bold
    position = 0, 380
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $text_color
    font_size = 16
    font_family = $font_family SemiBold
    position = 0, 300
    halign = center
    valign = center
}

label { # Battery
  text = cmd[update:1000] [[ $(cat /sys/class/power_supply/BAT0/status) == "Discharging" ]] && echo "$(cat /sys/class/power_supply/BAT0/capacity)"%
  font_color = $entry_color
  font_size = 14
  font_family = SF Pro Text ExtraBold
  color = $text_color
  position = -6, -0
  halign = right
  valign = top
}

image { # User avatar
  path = /var/lib/AccountsService/icons/$USER
  halign = left
  valign = bottom
  size = 40
  border_size = 0
  position = 10, 10
  zindex = -99
}
