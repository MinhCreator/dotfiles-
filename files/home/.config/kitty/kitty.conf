include ./colors.conf

# font_size 13.5
font_size 12.5

font_family      family="JetBrainsMono Nerd Font" style="Regular"
bold_font        family="JetBrainsMono Nerd Font" style="Bold"
italic_font      family="JetBrainsMono Nerd Font" style="Italic"
bold_italic_font family="JetBrainsMono Nerd Font" style="Bold"

initial_window_width 122c
initial_window_height 32c

hide_window_decorations no
window_border_width 0pt
window_padding_width 0
window_margin_width 0
single_window_margin_width 0
single_window_padding_width 4

allow_remote_control yes
confirm_os_window_close 0

modify_font underline_position 2
modify_font underline_thickness 150%
enable_audio_bell no
background_opacity 1
background_blur 1
linux_display_server wayland

cursor_trail 0
cursor_trail_start_threshold 0
cursor_trail_decay 0.05 0.09

map ctrl+shift+t no_op
map ctrl+c copy_and_clear_or_interrupt
dynamic_background_opacity yes
transparent_background_colors #262626@0.9

cursor_blink_interval 0.5
cursor_stop_blinking_after 0

scrollbar never
momentum_scroll 0

# scrollback_lines 0
# wheel_scroll_multiplier 1.0
# wheel_scroll_min_lines 1
# touch_scroll_multiplier 1.0
# pixel_scroll no

tab_bar_edge top
tab_bar_style powerline
tab_bar_min_tabs 2
tab_powerline_style angled
tab_title_template "{index}:{title}"
active_tab_font_style   bold-italic
inactive_tab_font_style normal

draw_minimal_borders yes
window_border_width 0.5
remember_window_size no

map ctrl+backspace send_text all \x17
